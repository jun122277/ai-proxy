name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: Also run Go vulnerability and container checks (uses more runner time)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: make check
      - run: make vuln
        if: inputs.full
      - name: Check example configuration
        run: ./bin/gateway -config config/gateway.example.json -check-config

  container:
    name: Container checks
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose -f deploy/compose/compose.yaml config --quiet
      - run: make up smoke
      - name: Check runtime restrictions and clean shutdown
        run: |
          id=$(docker compose -f deploy/compose/compose.yaml ps -q gateway)
          test "$(docker inspect --format '{{.Config.User}}' "$id")" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$id")" = 'true'
          docker compose -f deploy/compose/compose.yaml stop gateway
          test "$(docker inspect --format '{{.State.ExitCode}}' "$id")" = '0'
      - run: make scan
      - name: Show logs and clean up
        if: always()
        run: |
          docker compose -f deploy/compose/compose.yaml logs --no-color
          make down
